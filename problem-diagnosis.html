<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="사업과 서비스의 현재 문제를 진단하고 다음 실행을 추천합니다."><title>PROBLEM — Business Diagnosis</title><style>:root{--bg:#07080b;--line:#ffffff18;--text:#f5f4ef;--muted:#9697a2;--lime:#c8ff38;--purple:#8d63ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#8d63ff22,transparent 30%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans KR",Arial,sans-serif}.wrap{width:min(1000px,92%);margin:auto;padding:45px 0 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:65px}.logo{font-weight:900;font-size:24px;color:#fff;text-decoration:none}.logo span{color:var(--lime)}.home{color:#888;text-decoration:none;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:10px 14px}.tag,.eyebrow{font-size:9px;letter-spacing:2px;color:#777}.hero{margin-bottom:48px}.eyebrow{color:var(--lime)}h1{font-size:clamp(45px,7vw,80px);line-height:.95;letter-spacing:-4px;margin:18px 0}h1 em{font-style:normal;color:var(--lime)}.hero p,.result p{color:var(--muted);line-height:1.8;max-width:680px}.progress{height:4px;background:#ffffff10;margin:30px 0 45px}.progress i{display:block;height:100%;width:0;background:var(--lime);transition:.4s}.card{background:#ffffff06;border:1px solid var(--line);border-radius:24px;padding:35px}.qno{font-size:10px;color:#777;letter-spacing:2px}.question{font-size:clamp(24px,4vw,38px);margin:18px 0 30px}.choices{display:grid;gap:12px}.choice{border:1px solid var(--line);background:#ffffff04;color:#ddd;border-radius:15px;padding:18px;text-align:left;cursor:pointer;font:inherit}.choice:hover,.choice.selected{background:#c8ff3812;border-color:var(--lime)}.choice b{display:block;color:var(--lime);font-size:10px;margin-bottom:5px}.actions{display:flex;justify-content:space-between;margin-top:28px}.btn{border:0;border-radius:100px;padding:14px 22px;font-weight:700;cursor:pointer}.next{background:var(--lime);color:#10110c}.back{background:transparent;color:#aaa;border:1px solid var(--line)}.result{display:none}.result.show{display:block}.kicker{font-size:10px;color:var(--lime);letter-spacing:2px}.priority{font-size:58px;font-weight:900;color:var(--lime);margin:12px 0}.result h2{font-size:40px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.box{padding:20px;border:1px solid var(--line);border-radius:16px;background:#ffffff06}.box b{color:var(--lime);font-size:10px;letter-spacing:1px}.box h3{margin:10px 0}.box p{font-size:12px;margin:0}.actions-result{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.primary{background:var(--lime);color:#111;text-decoration:none}.secondary{background:#fff;color:#111;text-decoration:none}.restart{background:#fff;color:#111}@media(max-width:650px){.card{padding:24px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="./">PROBLEM<span>.</span></a><div class="tag">BUSINESS PROBLEM CHECK · 2026</div><a class="home" href="./">포트폴리오</a></header><section class="hero"><div class="eyebrow">BUSINESS / PRODUCT DIAGNOSIS</div><h1>지금 사업의 문제를<br><em>확인해보세요.</em></h1><p>8개의 질문으로 현재 가장 큰 병목을 찾고, 무엇부터 해결해야 하는지와 적합한 실행 방법을 추천합니다.</p></section><div class="progress"><i id="progress"></i></div><section id="quiz" class="card"><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="actions"><button class="btn back" id="back">← 이전</button><button class="btn next" id="next">다음 →</button></div></section><section id="result" class="card result"><div class="kicker">YOUR BUSINESS PROBLEM</div><div class="priority" id="priority"></div><h2 id="title"></h2><p id="desc"></p><div class="grid" id="boxes"></div><div class="actions-result"><button class="btn restart" onclick="restart()">다시 진단하기</button><a id="contact" class="btn primary">이 문제 해결 상담 ↗</a><a class="btn secondary" href="./">포트폴리오 보기 ↗</a></div></section><div style="text-align:center;color:#555;font-size:9px;margin-top:45px">PROBLEM DIAGNOSIS · DISCOVER → BUILD → VALIDATE</div></div><script>
const qs=[["가장 답답한 문제는 무엇인가요?",["무엇을 만들어야 할지 모르겠다.","고객이 누구인지 불명확하다.","만들었지만 고객 반응이 없다.","문의나 판매로 이어지지 않는다."]],["현재 가장 부족한 것은?",["사업 방향과 우선순위","고객 이해와 포지셔닝","제품 완성도와 사용성","유입과 전환 구조"]],["새로운 서비스를 시작한다면 가장 먼저 필요한 것은?",["아이디어를 구조화하는 것","타깃 고객을 정의하는 것","MVP를 만드는 것","랜딩페이지와 판매 구조를 만드는 것"]],["현재 고객은 어떻게 서비스를 발견하나요?",["아직 명확하지 않다.","지인·소개 중심이다.","검색·콘텐츠·커뮤니티를 통해 온다.","광고·랜딩·문의 흐름이 있다."]],["제품/서비스가 있다면 가장 큰 문제는?",["무엇을 개선할지 모르겠다.","고객이 왜 필요한지 설명하기 어렵다.","사용 과정이 복잡하다.","방문자는 있지만 전환이 낮다."]],["한 달 안에 하나만 해결한다면?",["사업 모델 정리","고객/브랜드 메시지 정리","MVP/웹사이트 제작","전환 퍼널 개선"]],["현재 팀이나 개인의 상황은?",["아이디어 단계","기획은 있지만 실행이 막혀 있다.","제품은 있고 개선이 필요하다.","이미 운영 중이며 성장을 원한다."]],["가장 원하는 결과는?",["명확한 실행 계획","정확한 고객과 제안","실제로 작동하는 제품","문의·매출로 이어지는 시스템"]]];
const types=[
["DIRECTION","방향과 우선순위 문제","무엇을 만들지보다 먼저 누구의 어떤 문제를 해결할지 정리해야 합니다.","전략 정리 / MVP 기획","문제 정의 → 고객 → 핵심 가치 → MVP 범위를 함께 정리합니다."],
["CUSTOMER","고객·포지셔닝 문제","제품보다 고객과 메시지를 먼저 선명하게 만드는 것이 중요합니다.","고객·서비스 전략","타깃 고객과 제안 가치를 정리하고 웹 메시지로 연결합니다."],
["PRODUCT","제품·실행 문제","아이디어를 실제로 사용할 수 있는 MVP와 경험으로 빠르게 검증해야 합니다.","웹사이트 / MVP 제작","핵심 기능과 사용자 흐름을 정하고 빠르게 출시합니다."],
["CONVERSION","전환·성장 문제","유입 이후 사용자가 문의·구매까지 이동하는 구조를 개선해야 합니다.","랜딩 / 전환 최적화","페이지 구조, CTA, 문의 흐름과 핵심 지표를 개선합니다."]
];
let step=0,a=Array(qs.length).fill(null);
const q=document.getElementById("question"),ch=document.getElementById("choices");
function render(){let x=qs[step];document.getElementById("qno").textContent="QUESTION "+String(step+1).padStart(2,"0")+" / "+qs.length;q.textContent=x[0];ch.innerHTML=x[1].map((v,i)=>'<button class="choice '+(a[step]===i?"selected":"")+'" onclick="pick('+i+')"><b>0'+(i+1)+"</b>"+v+"</button>").join("");document.getElementById("progress").style.width=((step+1)/qs.length*100)+"%";document.getElementById("back").style.visibility=step?"visible":"hidden"}
function pick(i){a[step]=i;render()}
document.getElementById("back").onclick=()=>{if(step){step--;render()}};document.getElementById("next").onclick=()=>{if(a[step]===null){alert("답변을 선택해주세요.");return}if(step<qs.length-1){step++;render()}else result()};
function result(){let s=[0,0,0,0];a.forEach(v=>s[v]++);let best=s.indexOf(Math.max(...s)),pct=Math.round(s[best]/qs.length*100),t=types[best];document.getElementById("quiz").style.display="none";document.getElementById("result").classList.add("show");document.getElementById("progress").style.width="100%";document.getElementById("priority").textContent=pct+"%";document.getElementById("title").textContent=t[1];document.getElementById("desc").textContent=t[2]+" 추천 실행: "+t[3];document.getElementById("boxes").innerHTML='<div class="box"><b>ROOT CAUSE</b><h3>'+t[1]+'</h3><p>'+t[2]+'</p></div><div class="box"><b>RECOMMENDED SERVICE</b><h3>'+t[3]+'</h3><p>'+t[4]+'</p></div><div class="box"><b>FIRST ACTION</b><h3>가장 작은 검증부터</h3><p>문제를 한 가지로 좁히고 빠르게 확인할 수 있는 결과물을 만듭니다.</p></div><div class="box"><b>SUCCESS SIGNAL</b><h3>실제 사용자 반응</h3><p>문의, 사용, 전환 등 한 가지 핵심 지표를 정해 개선합니다.</p></div>';document.getElementById("contact").href="./?problem="+encodeURIComponent(t[1])+"&service="+encodeURIComponent(t[3])+"&priority="+pct+"#contact"}
function restart(){step=0;a=Array(qs.length).fill(null);document.getElementById("result").classList.remove("show");document.getElementById("quiz").style.display="block";render();scrollTo({top:0,behavior:"smooth"})}render();
</script></body></html>
