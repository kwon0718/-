<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="개발자 역량 진단 — 현재 성향과 성장 방향을 확인하세요"><title>VERIFY — Developer Career Diagnosis</title><style>:root{--bg:#07080b;--line:#ffffff18;--text:#f5f4ef;--muted:#9697a2;--lime:#c8ff38}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#8d63ff22,transparent 28%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans KR",Arial,sans-serif;min-height:100vh}.wrap{width:min(1000px,92%);margin:auto;padding:45px 0 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:65px}.logo{font-weight:900;font-size:24px}.logo span{color:var(--lime)}.home{color:#888;text-decoration:none;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:10px 14px}.tag{font-size:9px;letter-spacing:2px;color:#777}.hero{margin-bottom:48px}.eyebrow{color:var(--lime);font-size:10px;letter-spacing:2px}.hero h1{font-size:clamp(45px,7vw,80px);line-height:.95;letter-spacing:-4px;margin:18px 0}.hero h1 em{font-style:normal;color:var(--lime)}.hero p,.result p{color:var(--muted);line-height:1.8;max-width:680px}.progress{height:4px;background:#ffffff10;margin:30px 0 45px}.progress i{display:block;height:100%;width:0;background:var(--lime);transition:.4s}.card{background:#ffffff06;border:1px solid var(--line);border-radius:24px;padding:35px}.qno{font-size:10px;color:#777;letter-spacing:2px}.question{font-size:clamp(24px,4vw,38px);margin:18px 0 30px}.choices{display:grid;gap:12px}.choice{border:1px solid var(--line);background:#ffffff04;color:#ddd;border-radius:15px;padding:18px;text-align:left;cursor:pointer;font:inherit;transition:.2s}.choice:hover,.choice.selected{background:#c8ff3812;border-color:#c8ff38}.choice b{display:block;color:var(--lime);font-size:10px;margin-bottom:5px}.actions{display:flex;justify-content:space-between;margin-top:28px}.btn{border:0;border-radius:100px;padding:14px 22px;font-weight:700;cursor:pointer}.next{background:var(--lime);color:#10110c}.back{background:transparent;color:#aaa;border:1px solid var(--line)}.result{display:none}.result.show{display:block}.result-kicker{font-size:10px;color:var(--lime);letter-spacing:2px}.score{font-size:78px;font-weight:900;color:var(--lime);margin-top:12px}.result h2{font-size:40px;margin:0 0 10px}.bar{margin:18px 0}.barhead{display:flex;justify-content:space-between;font-size:12px}.track{height:8px;border:1px solid var(--line);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--lime);transition:1s}.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.tip{padding:20px;border:1px solid var(--line);border-radius:16px}.tip span{font-size:11px;color:#888;line-height:1.6}.result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}.recommend{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}.service-box{border:1px solid #ffffff18;border-radius:16px;padding:20px;background:#ffffff06}.service-box b{color:#c8ff38;font-size:10px;letter-spacing:1px}.service-box h3{margin:10px 0;font-size:20px}.service-box p{font-size:11px;margin:0 0 15px}.service-box a{color:#c8ff38;text-decoration:none;font-size:11px}.service-box.primary{border-color:#c8ff3850;background:#c8ff3809}@media(max-width:650px){.recommend{grid-template-columns:1fr}}.restart{background:#fff;color:#111}.portfolio{display:inline-block;text-decoration:none;background:var(--lime);color:#111}.footer{text-align:center;color:#555;font-size:9px;margin-top:45px}@media(max-width:650px){.card{padding:24px}.tips{grid-template-columns:1fr}.tag{display:none}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="./">VERIFY<span>.</span></a><div class="tag">CAREER DIAGNOSIS · 2026</div><a class="home" href="./">포트폴리오</a></header><section class="hero"><div class="eyebrow">DEVELOPER CAREER CHECK</div><h1>당신의 개발 역량을<br><em>확인해보세요.</em></h1><p>8개의 질문에 답하면 현재 역량과 개발 성향을 분석합니다. 결과에서는 다음 성장 방향과 포트폴리오를 바로 확인할 수 있습니다.</p></section><div class="progress"><i id="progress"></i></div><section id="quiz" class="card"><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="actions"><button class="btn back" id="back">← 이전</button><button class="btn next" id="next">다음 →</button></div></section><section id="result" class="card result"><div class="result-kicker">YOUR RESULT</div><div class="score" id="score"></div><h2 id="resultTitle"></h2><p id="resultDesc"></p><div id="bars"></div><div class="tips" id="tips"></div><div class="recommend" id="recommend"></div><div class="result-actions"><button class="btn restart" onclick="restart()">다시 진단하기</button><a class="btn portfolio" href="./">내 포트폴리오 보기 ↗</a></div></section><div class="footer">VERIFY DIAGNOSIS · STRATEGY → BUILD → VALIDATE</div></div><script>
const questions=[["새로운 기술을 만났을 때 나는?",["공식 문서를 읽고 직접 실험한다.","예제와 튜토리얼을 먼저 찾아본다.","다른 사람의 구현을 분석한다.","일단 만들어보면서 익힌다."]],["버그를 발견했다. 가장 먼저 하는 일은?",["재현 조건부터 정리한다.","로그와 에러 메시지를 확인한다.","검색해서 비슷한 사례를 찾는다.","여러 방법을 빠르게 시도한다."]],["사용자에게 가장 중요한 것은?",["빠르고 안정적인 경험","직관적인 UI","새롭고 재미있는 경험","목적을 빠르게 달성하는 것"]],["코드 리뷰에서 가장 신경 쓰는 것은?",["구조와 유지보수성","가독성과 팀 규칙","성능과 최적화","기능이 제대로 동작하는지"]],["프로젝트를 시작하면?",["요구사항과 구조를 먼저 설계한다.","화면을 먼저 만들어본다.","작은 프로토타입부터 만든다.","일단 핵심 기능을 구현한다."]],["팀에서 가장 자신 있는 역할은?",["아키텍처와 기술 방향","UI와 사용자 경험","아이디어와 프로토타이핑","문제 해결과 실행"]],["새 프로젝트에 하루가 주어진다면?",["기술 스택과 구조를 결정한다.","핵심 화면을 완성한다.","차별화된 인터랙션을 만든다.","가장 중요한 기능을 배포한다."]],["앞으로 가장 키우고 싶은 능력은?",["시스템 설계","제품/UX 감각","창의적인 인터랙션","실전 문제 해결"]]];
const types=[["SYSTEM BUILDER","구조와 안정성을 중시하는 시스템형 개발자입니다.","Architecture","시스템 설계와 백엔드/인프라 역량을 깊게 가져가 보세요.","MVP/시스템 구축","서비스 구조와 API·백엔드 설계를 함께 정리합니다."],["PRODUCT MAKER","사용자의 문제를 제품으로 해결하는 프로덕트형 개발자입니다.","Product & UX","사용자 인터뷰와 제품 지표를 개발 과정에 연결해 보세요.","제품/MVP 제작","아이디어를 사용자 흐름과 실제 MVP로 구체화합니다."],["CREATIVE ENGINEER","기술과 디자인의 경계를 넘나드는 크리에이티브 개발자입니다.","Creative Web","Canvas, WebGL, Motion 등을 활용한 작업을 만들어 보세요.","인터랙티브 웹 제작","브랜드와 서비스를 차별화하는 웹 경험을 제작합니다."],["FAST EXECUTOR","빠르게 실행하고 결과를 만드는 실행형 개발자입니다.","Execution","작은 프로젝트를 실제 배포까지 끝내는 습관을 강화해 보세요.","웹사이트 빠른 구축","핵심 기능 중심으로 빠르게 만들고 실제 배포합니다."]];
let step=0,answers=Array(questions.length).fill(null),q=document.getElementById("question"),choices=document.getElementById("choices");
function render(){let a=questions[step];document.getElementById("qno").textContent="QUESTION "+String(step+1).padStart(2,"0")+" / "+questions.length;q.textContent=a[0];choices.innerHTML=a[1].map((v,i)=>'<button class="choice '+(answers[step]===i?"selected":"")+'" onclick="select('+i+')"><b>0'+(i+1)+"</b>"+v+"</button>").join("");document.getElementById("progress").style.width=((step+1)/questions.length*100)+"%";document.getElementById("back").style.visibility=step?"visible":"hidden"}
function select(i){answers[step]=i;render()}document.getElementById("back").onclick=()=>{if(step){step--;render()}};document.getElementById("next").onclick=()=>{if(answers[step]===null){alert("답변을 선택해주세요.");return}if(step<questions.length-1){step++;render()}else showResult()};
function showResult(){let s=[0,0,0,0];answers.forEach(a=>s[a]++);let best=s.indexOf(Math.max(...s)),score=Math.round(s[best]/questions.length*100);document.getElementById("quiz").style.display="none";document.getElementById("result").classList.add("show");document.getElementById("progress").style.width="100%";document.getElementById("score").textContent=score+"%";document.getElementById("resultTitle").textContent=types[best][0];document.getElementById("resultDesc").textContent=types[best][1]+" 추천 성장 방향: "+types[best][3];document.getElementById("bars").innerHTML=types.map((t,i)=>'<div class="bar"><div class="barhead"><span>'+t[2]+'</span><b>'+(s[i]*12.5)+'%</b></div><div class="track"><div class="fill" style="width:'+(s[i]*12.5)+'%"></div></div></div>').join("");document.getElementById("tips").innerHTML=types.filter((t,i)=>i===best||s[i]>0).slice(0,3).map(t=>'<div class="tip"><strong>'+t[2]+'</strong><br><span>'+t[3]+"</span></div>").join("");
const rec=types[best];document.getElementById("recommend").innerHTML='<div class="service-box primary"><b>RECOMMENDED SERVICE</b><h3>'+rec[4]+'</h3><p>'+rec[1]+'</p><a href="./#contact">이 서비스로 상담하기 ↗</a></div><div class="service-box"><b>NEXT STEP</b><h3>포트폴리오에서 확인</h3><p>실제 제작 사례와 실행 방식을 확인하고 프로젝트를 구체화할 수 있습니다.</p><a href="./#work">작업 사례 보기 ↗</a></div>';}

window.restart=function(){step=0;answers=Array(questions.length).fill(null);document.getElementById("result").classList.remove("show");document.getElementById("quiz").style.display="block";render();scrollTo({top:0,behavior:"smooth"})};render();
</script></body></html>
